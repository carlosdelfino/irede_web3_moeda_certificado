<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171438">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <link rel="preload" href="{{ '/assets/fonts/poppins-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <noscript><link rel="stylesheet" href="{{ '/assets/css/no-script.css' | relative_url }}"></noscript>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body class="{% if page.layout == 'home' %}home-page{% else %}document-page{% endif %}">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    {% include header.html %}
    <main id="conteudo" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
