<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="iRede Web 3 — Início">
      <span class="brand-logo"><img src="{{ '/imgs/iRede-Logo.png' | relative_url }}" alt="iRede" width="132" height="66"></span>
      <span class="brand-divider"></span><span class="brand-label">LAB / WEB 3</span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="site-navigation" type="button"><span></span><span></span><span class="sr-only">Abrir menu</span></button>
    <nav id="site-navigation" class="site-navigation" aria-label="Navegação principal">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>O projeto</a>
      {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="nav-source" href="{{ site.repository_url }}" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span><span class="sr-only"> (nova aba)</span></a>
    </nav>
  </div>
</header>
